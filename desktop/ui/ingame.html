<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revu: In game</title>
<script src="./nav-prepaint.js"></script>
<script src="./framed.js"></script>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell pg-shell">
    <div class="eyebrow">Live</div>
    <div class="hero"><h1 id="hero-title">In game</h1></div>
    <div class="statusline" id="statusline">
      <span class="dot" id="lcu-dot"></span>
      <b>Cooldowns, matchup and notes</b>
    </div>

    <!-- LIVE banner (game saved at end, etc). Data-driven. -->
    <div class="live-banner" id="live-banner" hidden></div>

    <!-- NO ACTIVE GAME — empty state when no champ is detected. -->
    <div class="glass card pg-card noactive" id="noactive" hidden>
      <div class="seclabel-in">No active game</div>
      <div class="noactive-p">When you queue up, your cooldowns, matchup, and saved notes appear here automatically.</div>
    </div>

    <!-- ════ COOLDOWNS & INTEL ════ rotating deck -->
    <div class="seclabel" id="intel-label">Cooldowns and intel</div>
    <div class="glass card pg-intel" id="intel-wrap" hidden>
      <div class="intel-deck" id="intel-deck"></div>
      <div class="intel-foot">
        <div class="intel-arrows" id="intel-arrows" hidden>
          <button type="button" class="intel-arr" data-action="intel_prev" aria-label="Previous intel">‹</button>
          <button type="button" class="intel-arr" data-action="intel_next" aria-label="Next intel">›</button>
        </div>
        <div class="intel-dots" id="intel-dots"></div>
      </div>
    </div>

    <!-- ════ MATCHUP ════ -->
    <div class="glass card pg-card matchup" id="matchup-card" hidden>
      <div class="seclabel-in">Matchup</div>
      <div class="matchup-pairing" id="matchup-pairing" hidden></div>
      <div class="matchup-vs">
        <span class="matchup-my" id="matchup-my">…</span>
        <span class="matchup-x">vs</span>
        <span class="matchup-enemy" id="matchup-enemy">…</span>
      </div>
    </div>

    <!-- ════ MATCHUP HISTORY ════ -->
    <div class="glass card pg-card mh" id="mh-card" hidden>
      <div class="seclabel-in" id="mh-header">Matchup notes</div>
      <div id="mh-list"></div>
    </div>

    <!-- ════ YOUR PRE-GAME PROMPTS ════ answers carried from champ select -->
    <div class="glass card pg-card prompts" id="prompts-card" hidden>
      <div class="seclabel-in">Objective reminders</div>
      <div id="prompts-list"></div>
    </div>

    <!-- ERROR PANEL -->
    <div class="card errpanel" id="errpanel" hidden>
      <div class="crow">
        <div>
          <div class="vline" id="err-line">Couldn’t load live intel.</div>
          <div class="vsmall" id="err-detail"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── TEMPLATES (shared with pregame.html; pregame.js renders both) ── -->
  <template id="tpl-intel">
    <div class="intel-card">
      <div class="intel-eyebrow"></div>
      <div class="intel-headline"></div>
      <div class="intel-body"></div>
    </div>
  </template>

  <template id="tpl-mh">
    <div class="mh-row">
      <div class="mh-note"></div>
      <div class="mh-meta"><span class="mh-date"></span><span class="mh-helpful" hidden></span></div>
    </div>
  </template>

  <template id="tpl-prompt-block">
    <div class="pb">
      <div class="pb-head"><span class="pb-eyebrow"></span><span class="pb-title"></span></div>
      <div class="pb-prompts"></div>
    </div>
  </template>

  <template id="tpl-prompt">
    <label class="p-row">
      <span class="p-label"></span>
      <textarea class="pg-textarea p-input" rows="2" placeholder="Write your answer…"></textarea>
    </label>
  </template>

  <script type="module" src="./pregame.js"></script>
  <script type="module" src="./tutorial.js"></script>
</body>
</html>
