<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revu: Learning objective notes</title>
<script src="./nav-prepaint.js"></script>
<script src="./framed.js"></script>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./learning-pages.css">
</head>
<body>
  <div class="shell">
    <div class="eyebrow">Learning objective</div>

    <!-- HEADER: back button + objective title / status -->
    <div class="on-head">
      <button class="on-back" id="back-btn" data-action="back" type="button" aria-label="Back to learning objectives">‹</button>
      <div class="on-titles">
        <h1 class="on-title" id="obj-title">Learning objective</h1>
        <div class="on-status" id="obj-status"></div>
      </div>
    </div>

    <div class="statusline" id="statusline"><span class="dot"></span> <b id="status-text">Loading…</b></div>

    <!-- REVIEW NOTES -->
    <section class="on-sec" id="review-sec" hidden>
      <h2 class="on-eyebrow">Review notes</h2>
      <div class="on-list" id="review-list"></div>
    </section>

    <!-- EXECUTION NOTES -->
    <section class="on-sec" id="exec-sec" hidden>
      <h2 class="on-eyebrow">Execution notes</h2>
      <div class="on-list" id="exec-list"></div>
    </section>

    <!-- PROMPT ANSWERS (custom per-objective prompts the user answered per game) -->
    <section class="on-sec" id="prompt-sec" hidden>
      <h2 class="on-eyebrow">Prompt answers</h2>
      <div class="on-list" id="prompt-list"></div>
    </section>

    <!-- CLIPS AND BOOKMARKS -->
    <section class="on-sec" id="clip-sec" hidden>
      <h2 class="on-eyebrow">Clips and bookmarks</h2>
      <div class="on-list" id="clip-list"></div>
    </section>

    <!-- EMPTY STATE -->
    <div class="card on-empty" id="empty" hidden>
      <div class="on-empty-h">No notes or clips are linked to this learning objective yet.</div>
    </div>

    <!-- ERROR PANEL (data-driven, mirrors dashboard) -->
    <div class="card errpanel" id="errpanel" hidden>
      <div class="crow">
        <div>
          <div class="vline" id="err-line">Couldn't load these notes.</div>
          <div class="vsmall" id="err-detail"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── REPEATING-CELL TEMPLATES ── -->

  <!-- A review note: header + notes, with a button to its match review. -->
  <template id="tpl-review">
    <div class="on-card">
      <div class="on-row">
        <div class="on-card-main">
          <div class="on-card-header"></div>
          <div class="on-card-body"></div>
        </div>
        <button class="on-jump on-jump-open" data-action="open_review" type="button">Review match</button>
      </div>
    </div>
  </template>

  <!-- An execution note: header + italic note. No jump button (read-only). -->
  <template id="tpl-exec">
    <div class="on-card">
      <div class="on-card-header"></div>
      <div class="on-card-body italic"></div>
    </div>
  </template>

  <!-- A prompt-answers group: the prompt label + phase, then its answer cards. -->
  <template id="tpl-prompt-group">
    <div class="on-group">
      <div class="on-group-head">
        <span class="on-group-label"></span>
        <span class="on-group-phase"></span>
      </div>
      <div class="on-list on-group-answers"></div>
    </div>
  </template>

  <!-- One game's answer to a prompt: header + answer, with a button to its match review. -->
  <template id="tpl-prompt-answer">
    <div class="on-card">
      <div class="on-row">
        <div class="on-card-main">
          <div class="on-card-header"></div>
          <div class="on-card-body"></div>
        </div>
        <button class="on-jump on-jump-open" data-action="open_review" type="button">Review match</button>
      </div>
    </div>
  </template>

  <!-- A clip/bookmark: time chip + game label, note, tags, and a Watch VOD button
       (the only control; the card itself is not a second, nested button). -->
  <template id="tpl-clip">
    <div class="on-card">
      <div class="on-row">
        <div class="on-card-main">
          <div class="on-clip-top">
            <span class="on-clip-time"></span>
            <span class="on-clip-game"></span>
          </div>
          <div class="on-card-body" hidden></div>
          <div class="on-clip-tags" hidden></div>
        </div>
        <button class="on-jump on-jump-play" data-action="play_clip" type="button">Watch VOD</button>
      </div>
    </div>
  </template>

  <script type="module" src="./objectivenotes.js"></script>
</body>
</html>
