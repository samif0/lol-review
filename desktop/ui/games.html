<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revu: Match library</title>
<script src="./nav-prepaint.js"></script>
<script src="./framed.js"></script>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./learning-pages.css">
<link rel="stylesheet" href="./games-page.css">
</head>
<body class="games-page">
  <div class="shell">
    <div class="eyebrow">Review</div>
    <!-- Hero row: title on the left, Manual Entry action on the right (moved off the
         nav rail — manual entry is a Games-page action, not a daily-loop destination). -->
    <div class="games-hero">
      <div class="hero"><h1>Match library</h1></div>
      <button class="review games-manual-btn" id="manual-entry" data-action="manual_entry" type="button">Add a game manually</button>
    </div>
    <p class="page-intro">Choose a game to review your practice, save a takeaway, or watch its recording.</p>
    <div class="statusline" id="statusline"><span class="dot"></span> <b id="status-text">Loading…</b></div>

    <!-- PRIMARY: Review-Queue command bar (the one loud element) + filter segment.
         Carries the live unreviewed count and switches the list below. -->
    <div class="glass primary games-bar" id="queue-bar">
      <div class="games-bar-lead">
        <div class="k" id="queue-k">Your games</div>
        <h2 id="queue-h">Review Queue</h2>
        <div class="games-bar-cnt" id="queue-cnt"><span class="pdot"></span> <span id="queue-cnt-text">…</span></div>
      </div>
      <div class="seg" id="seg" role="tablist" aria-label="Switch games view">
        <button class="on" data-action="view" data-view="queue" role="tab" aria-selected="true">To review</button>
        <button data-action="view" data-view="today" role="tab" aria-selected="false">Today</button>
        <button data-action="view" data-view="history" role="tab" aria-selected="false">History</button>
        <button data-action="view" data-view="vod" role="tab" aria-selected="false">With recordings</button>
        <button data-action="view" data-view="removed" role="tab" aria-selected="false">Removed</button>
      </div>
    </div>

    <!-- AT-A-GLANCE — reuse the dashboard stat strip. -->
    <div class="strip" id="strip"></div>

    <!-- THE LIST — clickable game rows. The most prominent section. -->
    <div class="games-list-heading" id="games-label"><h2>Matches</h2><span id="games-sub"></span></div>
    <div id="games-list"></div>

    <!-- Empty / filtered-empty state. -->
    <div class="games-empty" id="games-empty" hidden>
      <div class="games-empty-h" id="games-empty-h">No games recorded yet.</div>
      <div class="games-empty-p" id="games-empty-p">Keep Revu open during a Ranked Solo/Duo game, or add a game manually.</div>
    </div>

    <!-- Remove from history is a soft hide: the game and its notes stay saved, Undo
         brings it back, and the Removed view restores it later. The same toast
         reports a removal or restore that failed (without Undo). -->
    <div class="games-undo" id="games-undo" role="status" aria-live="polite" hidden>
      <span id="games-undo-text"></span>
      <button class="games-undo-btn" id="games-undo-btn" type="button" data-action="undo_hide">Undo</button>
    </div>

    <!-- Load more — only when the server has more pages. Small, calm glass. -->
    <div class="loadwrap" id="loadwrap" hidden>
      <button class="loadmore" id="loadmore" data-action="load_more">Load More</button>
    </div>

    <!-- ERROR PANEL (data-driven, mirrors dashboard) -->
    <div class="card errpanel" id="errpanel" hidden>
      <div class="crow">
        <div>
          <div class="vline" id="err-line">Couldn't load your games.</div>
          <div class="vsmall" id="err-detail"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── REPEATING-CELL TEMPLATES ── -->
  <template id="tpl-stat">
    <div class="stat">
      <div class="k"></div>
      <div class="v"></div>
      <div class="s"></div>
    </div>
  </template>

  <!-- One match, one primary action. Result, matchup and the action each have
       a clear position; supporting status text remains part of the same row. -->
  <template id="tpl-gamerow">
    <div class="card gamerow gamerow-game" data-action="open_review" tabindex="0" role="button">
      <div class="crow">
        <span class="grow-wl"></span>
        <div class="grow-main">
          <div class="grow-top">
            <span class="vline grow-champ"></span>
          </div>
          <div class="vsmall grow-meta"></div>
          <div class="grow-tokens"></div>
        </div>
        <div class="grow-right">
          <div class="grow-kda"><span class="grow-kda-n"></span><span class="grow-kda-r"></span></div>
          <div class="gamerow-cue">Review <span class="arr" aria-hidden="true">→</span></div>
          <button class="gamerow-remove" type="button" data-action="hide_game">Remove from history</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Compact status text; unavailable objective tagging adds no extra badge. -->
  <template id="tpl-token">
    <span class="gtoken"></span>
  </template>

  <script type="module" src="./games.js"></script>
</body>
</html>
