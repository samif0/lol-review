<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revu: Match library</title>
<script src="./nav-prepaint.js"></script>
<script src="./framed.js"></script>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./kit.css">
<link rel="stylesheet" href="./learning-pages.css">
<link rel="stylesheet" href="./games-page.css">
<link rel="stylesheet" href="./appearance.css">
</head>
<body class="games-page">
  <div class="shell lib">
    <!-- Header: the page title and the one page action. -->
    <header class="lib-head">
      <h1 class="ui-title">Match library</h1>
      <button class="ui-btn ui-btn-quiet" id="manual-entry" data-action="manual_entry" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add a game</button>
    </header>
    <p class="lib-loading" id="statusline" role="status"><b id="status-text">Loading your games…</b></p>

    <!-- Search filters the rows already loaded, by champion or enemy. -->
    <div class="lib-search" role="search">
      <svg class="lib-search-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input class="ui-field lib-search-input" id="lib-search" type="search" placeholder="Search by champion" aria-label="Search by champion or enemy" autocomplete="off" spellcheck="false">
      <button class="ui-iconbtn lib-search-clear" id="lib-search-clear" type="button" data-action="clear_search" aria-label="Clear search" title="Clear search" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
    </div>

    <!-- Filters (server-side views) and the summary of the selected one. Today has no
         pill of its own; it appears while ?view=today is selected. -->
    <div class="lib-filters">
      <div class="lib-pills" id="seg" role="tablist" aria-label="Show matches">
        <button class="ui-pill lib-filter" type="button" data-action="view" data-view="history" role="tab" aria-selected="false">All</button>
        <button class="ui-pill lib-filter is-on on" type="button" data-action="view" data-view="queue" role="tab" aria-selected="true">To review <b class="lib-filter-n" id="queue-count" hidden></b></button>
        <button class="ui-pill lib-filter" type="button" data-action="view" data-view="vod" role="tab" aria-selected="false">With recordings</button>
        <button class="ui-pill lib-filter" type="button" data-action="view" data-view="removed" role="tab" aria-selected="false">Removed</button>
        <button class="ui-pill lib-filter" type="button" data-action="view" data-view="today" role="tab" aria-selected="false" hidden>Today</button>
      </div>
      <p class="lib-summary" id="strip" title="Remakes are listed but not counted." hidden></p>
    </div>
    <p class="lib-search-status" id="lib-search-status" role="status" aria-live="polite" hidden></p>

    <!-- ERROR PANEL (data-driven, mirrors dashboard) -->
    <div class="lib-error errpanel" id="errpanel" role="alert" hidden>
      <div class="vline" id="err-line">Couldn't load your games.</div>
      <div class="vsmall" id="err-detail"></div>
    </div>

    <!-- THE LIST: day headings and clickable match rows, siblings in one list. -->
    <div class="lib-list" id="games-list"></div>

    <!-- Empty state for the selected view, and for a search with no match. -->
    <div class="ui-empty lib-empty" id="games-empty" hidden>
      <b id="games-empty-h">No games recorded yet.</b>
      <span id="games-empty-p">Keep Revu open during a Ranked Solo/Duo game, or use Add a game.</span>
    </div>
    <div class="ui-empty lib-empty" id="lib-search-empty" hidden>
      <b>Nothing here matches your search.</b>
      <span>Search looks at champion and enemy names.</span>
      <button class="ui-btn ui-btn-quiet" type="button" data-action="clear_search">Clear search</button>
    </div>

    <!-- History pages: how many are loaded, and Load more while the server has more. -->
    <div class="lib-foot">
      <span class="lib-count" id="lib-count" hidden></span>
      <span class="loadwrap" id="loadwrap" hidden><button class="ui-btn ui-btn-quiet" id="loadmore" type="button" data-action="load_more">Load more</button></span>
    </div>

    <div class="games-dock">
      <!-- While games are selected: how many, and what can be done to them. Skip applies to
           the selected games waiting for review, Unskip to the selected skipped ones. -->
      <div class="games-bulk" id="games-bulk" role="group" aria-label="Selected games" hidden>
        <span class="games-bulk-n" id="games-bulk-n" role="status" aria-live="polite"></span>
        <button class="ui-btn ui-btn-ghost" id="games-bulk-all" type="button" data-action="pick_all">Select all</button>
        <button class="ui-btn ui-btn-quiet" id="games-bulk-unskip" type="button" data-action="unskip_picked" hidden>Unskip</button>
        <button class="ui-btn ui-btn-primary" id="games-bulk-skip" type="button" data-action="skip_picked" hidden>Skip</button>
        <button class="ui-iconbtn games-bulk-clear" id="games-bulk-clear" type="button" data-action="pick_none" aria-label="Clear selection" title="Clear selection"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
      </div>
      <!-- Remove from history is a soft hide: the game and its notes stay saved, Undo
           brings it back, and the Removed view restores it later. Skip and Unskip are
           undone the same way. The same toast reports a change that failed (without Undo). -->
      <div class="games-undo" id="games-undo" role="status" aria-live="polite" hidden>
        <span id="games-undo-text"></span>
        <button class="ui-btn ui-btn-quiet games-undo-btn" id="games-undo-btn" type="button" data-action="undo">Undo</button>
      </div>
    </div>
  </div>

  <!-- ── REPEATING-CELL TEMPLATES ── -->
  <template id="tpl-stat">
    <span class="lib-stat"><b class="v"></b> <span class="k"></span></span>
  </template>

  <template id="tpl-day">
    <h2 class="lib-day"></h2>
  </template>

  <!-- One match, one primary action: the whole row opens it. Result, matchup, KDA,
       status, Skip, Remove and the action keep fixed columns; Skip and Remove show on
       hover or focus. A game that can be skipped (or unskipped) can also be selected: its
       checkbox takes the champion's place on hover, focus or while a selection is open.
       In Journal, the takeaway from this game's review sits under the matchup. -->
  <template id="tpl-gamerow">
    <div class="lib-row" data-action="open_review" tabindex="0" role="button">
      <span class="grow-wl"></span>
      <span class="lib-champ" aria-hidden="true"></span>
      <button class="ui-iconbtn lib-pick" type="button" data-action="pick_game" role="checkbox" aria-checked="false" hidden><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg></i></button>
      <span class="lib-m"><b class="lib-name"></b><span class="lib-meta"></span></span>
      <span class="lib-kda"><span class="lib-kda-n"></span><span class="lib-kda-r"></span></span>
      <span class="lib-st"></span>
      <button class="ui-btn ui-btn-ghost lib-skip" type="button" data-action="skip_game" hidden>Skip</button>
      <button class="ui-iconbtn lib-remove" type="button" data-action="hide_game" title="Remove from history" aria-label="Remove from history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
      <span class="lib-go">Review</span>
      <p class="lib-take own-words" data-theme-only="journal" hidden></p>
    </div>
  </template>

  <template id="tpl-tag">
    <span class="ui-tag lib-tag" aria-hidden="true"></span>
  </template>
  <template id="tpl-mark-video">
    <span class="lib-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg></span>
  </template>
  <template id="tpl-mark-objective">
    <span class="lib-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg></span>
  </template>
  <template id="tpl-sr">
    <span class="sr-only"></span>
  </template>

  <script type="module" src="./games.js"></script>
</body>
</html>
