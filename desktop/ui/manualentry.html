<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revu: Add a game manually</title>
<script src="./nav-prepaint.js"></script>
<script src="./framed.js"></script>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <div class="eyebrow">Match library</div>
    <div class="hero"><h1>Add a game manually</h1></div>
    <div class="statusline" id="statusline"><span class="dot"></span> <b id="status-text">Log a game Revu didn't capture.</b></div>

    <div class="me-form" id="me-form">
      <!-- Top-of-form error (champion or result missing / save failed) -->
      <div class="me-error" id="me-error" role="alert" hidden></div>

      <!-- CHAMPION + RESULT + KDA -->
      <div class="card">
        <div class="me-headrow">
          <div class="me-headcol">
            <label class="me-field-lbl" for="me-champ">Champion</label>
            <input class="me-champ" id="me-champ" type="text" placeholder="e.g., Ahri" autocomplete="off" required aria-required="true">
            <fieldset class="me-result">
              <legend class="me-field-lbl">Result</legend>
              <label class="me-radio"><input type="radio" name="result" id="me-win" value="win" required> <span class="rwin">Victory</span></label>
              <label class="me-radio"><input type="radio" name="result" id="me-loss" value="loss"> <span class="rloss">Defeat</span></label>
            </fieldset>
          </div>
          <div class="me-kda">
            <div class="me-kda-cell">
              <label class="me-kda-lbl" for="me-k">Kills</label>
              <input class="me-num" id="me-k" inputmode="numeric" value="0">
            </div>
            <span class="me-kda-sep" aria-hidden="true">/</span>
            <div class="me-kda-cell">
              <label class="me-kda-lbl" for="me-d">Deaths</label>
              <input class="me-num" id="me-d" inputmode="numeric" value="0">
            </div>
            <span class="me-kda-sep" aria-hidden="true">/</span>
            <div class="me-kda-cell">
              <label class="me-kda-lbl" for="me-a">Assists</label>
              <input class="me-num" id="me-a" inputmode="numeric" value="0">
            </div>
          </div>
        </div>
      </div>

      <!-- MENTAL RATING (same question as the Review page) -->
      <div class="card">
        <label class="seclabel" for="me-mental">How focused and calm were you? <span class="n">1 to 10</span></label>
        <div class="me-slrow">
          <input type="range" class="me-range" id="me-mental" min="1" max="10" step="1" value="5">
          <span class="me-slval" id="me-mental-val" aria-hidden="true">5</span>
        </div>
      </div>

      <!-- YOUR PRACTICE (collapsed when no learning objective is active) -->
      <div class="card" id="me-obj-card" hidden>
        <div class="seclabel">Your practice</div>
        <div id="me-obj-list"></div>
      </div>

      <!-- REFLECTION: the Review page's takeaway field (stored the same way). -->
      <div class="card">
        <label class="seclabel" for="me-notes">One thing to take into your next game</label>
        <textarea class="me-input me-multi" id="me-notes" rows="3" placeholder="One decision to repeat or change, and why…"></textarea>
        <p class="field-help">You can add the rest of your reflection on this match's Review page later.</p>
      </div>

      <!-- ACTIONS -->
      <div class="me-actions">
        <button class="me-cancel" id="me-cancel" data-action="cancel" type="button">Cancel</button>
        <button class="cta me-save" id="me-save" data-action="save" type="button">Save game</button>
      </div>
    </div>

    <!-- ERROR PANEL (data-driven, mirrors dashboard) -->
    <div class="card errpanel" id="errpanel" hidden>
      <div class="crow">
        <div>
          <div class="vline" id="err-line">Couldn't save this game.</div>
          <div class="vsmall" id="err-detail"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- One learning-objective assessment row: title + phase + practiced toggle + note. -->
  <template id="tpl-meobj">
    <div class="me-obj">
      <div class="me-obj-top">
        <div class="me-obj-head">
          <div class="me-obj-title"></div>
          <div class="me-obj-phase"></div>
        </div>
        <label class="me-toggle">
          <input type="checkbox" class="me-obj-practiced">
          <span class="me-toggle-track" aria-hidden="true"><span class="me-toggle-knob"></span></span>
          <span class="me-toggle-lbl">Practiced</span>
        </label>
      </div>
      <input class="me-input me-obj-note" type="text" placeholder="How did it go? (optional)" autocomplete="off">
    </div>
  </template>

  <script type="module" src="./manualentry.js"></script>
</body>
</html>
