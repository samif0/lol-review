<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revu: Manual Entry</title>
<script src="./nav-prepaint.js"></script>
<script src="./framed.js"></script>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <div class="eyebrow">Manual Entry</div>
    <div class="hero"><h1>Log a Game</h1></div>
    <div class="statusline" id="statusline"><span class="dot"></span> <b id="status-text">Hand-log a game that wasn't auto-captured.</b></div>

    <div class="me-form">
      <!-- Top-of-form error (champion required / save failed) -->
      <div class="me-error" id="me-error" hidden></div>

      <!-- CHAMPION + RESULT + KDA -->
      <div class="card bracket bracket-gold">
        <div class="me-headrow">
          <div class="me-headcol">
            <input class="me-champ" id="me-champ" type="text" placeholder="Champion Name" autocomplete="off">
            <div class="me-result">
              <label class="me-radio"><input type="radio" name="result" id="me-win"> <span class="rwin">Victory</span></label>
              <label class="me-radio"><input type="radio" name="result" id="me-loss" checked> <span class="rloss">Defeat</span></label>
            </div>
          </div>
          <div class="me-kda">
            <div class="me-kda-cell">
              <input class="me-num" id="me-k" inputmode="numeric" value="0" aria-label="Kills">
              <div class="me-kda-lbl">K</div>
            </div>
            <span class="me-kda-sep">/</span>
            <div class="me-kda-cell">
              <input class="me-num" id="me-d" inputmode="numeric" value="0" aria-label="Deaths">
              <div class="me-kda-lbl">D</div>
            </div>
            <span class="me-kda-sep">/</span>
            <div class="me-kda-cell">
              <input class="me-num" id="me-a" inputmode="numeric" value="0" aria-label="Assists">
              <div class="me-kda-lbl">A</div>
            </div>
          </div>
        </div>
      </div>

      <!-- MENTAL RATING -->
      <div class="card bracket">
        <div class="seclabel">Mental Rating</div>
        <div class="me-slrow">
          <input type="range" class="me-range" id="me-mental" min="1" max="10" step="1" value="5"
                 aria-label="Mental rating, 1 to 10">
          <span class="me-slval" id="me-mental-val">5</span>
        </div>
      </div>

      <!-- LEARNING OBJECTIVES (collapsed when none active) -->
      <div class="card bracket bracket-blue" id="me-obj-card" hidden>
        <div class="seclabel">Learning Objectives</div>
        <div id="me-obj-list"></div>
      </div>

      <!-- PERFORMANCE REVIEW -->
      <div class="card bracket">
        <div class="seclabel">Performance Review</div>
        <div class="me-field-lbl">What went well?</div>
        <textarea class="me-input me-multi" id="me-well" rows="3" placeholder="Good plays, decisions, mechanics…"></textarea>
        <div class="me-field-lbl">What could improve?</div>
        <textarea class="me-input me-multi" id="me-mistakes" rows="3" placeholder="Deaths, missed plays, bad decisions…"></textarea>
        <div class="me-field-lbl">Focus for next game</div>
        <input class="me-input" id="me-focus" type="text" placeholder="What will you focus on improving?" autocomplete="off">
      </div>

      <!-- ADDITIONAL NOTES -->
      <div class="card bracket">
        <div class="seclabel">Additional Notes</div>
        <textarea class="me-input me-multi" id="me-notes" rows="3" placeholder="Any other notes about this game…"></textarea>
      </div>

      <!-- ACTIONS -->
      <div class="me-actions">
        <button class="me-cancel" id="me-cancel" data-action="cancel" type="button">Cancel</button>
        <button class="cta me-save" id="me-save" data-action="save" type="button">Save Game Entry</button>
      </div>
    </div>

    <!-- ERROR PANEL (data-driven, mirrors dashboard) -->
    <div class="card errpanel" id="errpanel" hidden>
      <div class="crow">
        <div>
          <div class="vline" id="err-line">Couldn't save this game.</div>
          <div class="vsmall" id="err-detail"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- One learning-objective assessment row: title + phase + practiced toggle + note. -->
  <template id="tpl-meobj">
    <div class="me-obj">
      <div class="me-obj-top">
        <div class="me-obj-head">
          <div class="me-obj-title"></div>
          <div class="me-obj-phase"></div>
        </div>
        <label class="me-toggle">
          <input type="checkbox" class="me-obj-practiced">
          <span class="me-toggle-track"><span class="me-toggle-knob"></span></span>
          <span class="me-toggle-lbl">Not practiced</span>
        </label>
      </div>
      <input class="me-input me-obj-note" type="text" placeholder="How did you execute on this?" autocomplete="off">
    </div>
  </template>

  <script type="module" src="./manualentry.js"></script>
</body>
</html>
