# Dependency updates, kept deliberately quiet: at most one grouped PR per
# ecosystem per month, minor and patch only. Major upgrades (TypeScript, Vitest,
# Node types, asar, workers-types...) change tooling behavior and are done by hand
# in their own commit. The Overwolf Electron runtime and builder move only with a
# runtime upgrade (desktop/runtime), never on their own. Security updates are
# separate: enable Dependabot alerts and security updates in repository settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Restores the src/ projects through their committed packages.lock.json files.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      desktop:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@overwolf/ow-electron"
      - dependency-name: "@overwolf/ow-electron-builder"

  - package-ecosystem: npm
    directory: /proxy
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      proxy:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
