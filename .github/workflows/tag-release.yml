name: Create release tag

# One-shot helper for cutting a release from an environment whose Git
# credentials cannot push tags (remote Claude sessions get a 403 on
# refs/tags/*). Dispatch-only, collaborator-only, and restricted to
# release-shaped tag names on commits that are already on main.
#
# The push runs as github-actions[bot]. A repository ruleset that limits who can
# create v* tags refuses it unless GitHub Actions is on that ruleset's bypass
# list; without that bypass this helper cannot tag, and release tags must be
# pushed from a machine whose own credentials can create them (CONTRIBUTING.md).
#
# NOTE: a tag created here does NOT itself trigger release.yml — GitHub never
# chains workflow runs off the Actions token. After this succeeds, dispatch
# "Build & Release (Overwolf Electron)" on the new tag (the tag ref is what the Azure
# code-signing federated credential trusts).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v3.4.0, or v3.5.0-beta.1 for a prerelease)"
        required: true
      sha:
        description: "Commit SHA on main the tag points at"
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          # Same version rule as release.yml's guard job.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "refusing non-release tag name: $TAG"; exit 1
          fi
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-fA-F]{7,40}$'; then
            echo "refusing: sha must be a hexadecimal commit SHA"; exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse --verify "$SHA^{commit}")" || { echo "refusing: $SHA is not a commit"; exit 1; }
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "refusing: $commit is not on origin/main. Merge it first, then tag the merged commit."
            exit 1
          fi
          git tag "$TAG" "$commit"
          git push origin "refs/tags/$TAG"
          # Clean up a leftover helper BRANCH with the same name, if any
          # (an earlier workaround pushed refs/heads/v3.4.0).
          git push origin ":refs/heads/$TAG" || true
