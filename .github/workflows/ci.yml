name: CI

# The mechanical reviewer for the autonomous loop: every PR and every push to
# main must pass the same tests release.yml runs at tag time, plus the proxy and
# site checks that gate their manual deploys (scripts/guard-deploy.mjs). Branch
# protection should require every job below; auto-merge waits on them.
#
# Pinning policy (see release.yml): actions by commit SHA, named runner images,
# the .NET SDK from global.json, NuGet in locked mode (Directory.Build.props,
# CI=true), npm via lockfiles, ffmpeg checksum-verified.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A newer push to the same PR supersedes the older run. Every push to main gets
  # its own group, so no main commit is ever cancelled or replaced while queued:
  # a red main always names the commit that broke it.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Pull requests skip the Windows jobs their files cannot affect
  # (scripts/ci-changes.mjs; a site- or proxy-only PR finishes in about a
  # minute). Pushes to main always run everything. A skipped job reports
  # success to branch protection, so the gated jobs below run whenever this job
  # fails rather than being skipped with it.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      dotnet: ${{ steps.classify.outputs.dotnet }}
      desktop: ${{ steps.classify.outputs.desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # A pull_request checkout is the merge commit, whose first parent is the
      # base branch tip, so HEAD^1..HEAD is exactly what merging would change.
      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          cat "$RUNNER_TEMP/changed.txt"
          node scripts/ci-changes.mjs < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  # Core and Sidecar run on separate runners; dotnet-tests below keeps the one
  # check name branch protection requires.
  dotnet-core:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.dotnet == 'true') }}
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Hosted Windows TEMP can contain an 8.3 alias (RUNNER~1). Keep production
      # alias/reparse-point checks enabled and use the canonical runner scratch.
      - name: Configure canonical temporary directory
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Same invocations as release.yml so "green" is identical in both places.
      # Release builds treat warnings as errors and restore in locked mode.
      - name: Core tests
        run: dotnet test src/Revu.Core.Tests/Revu.Core.Tests.csproj -c Release -p:Platform=x64 --logger "console;verbosity=normal"

  dotnet-sidecar:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.dotnet == 'true') }}
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure canonical temporary directory
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Sidecar tests
        run: dotnet test src/Revu.Sidecar.Tests/Revu.Sidecar.Tests.csproj -c Release -p:Platform=x64 --logger "console;verbosity=normal"

  dotnet-tests:
    needs: [changes, dotnet-core, dotnet-sidecar]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require both .NET suites to pass or be skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          CORE: ${{ needs.dotnet-core.result }}
          SIDECAR: ${{ needs.dotnet-sidecar.result }}
        run: |
          echo "changes: $CHANGES, core: $CORE, sidecar: $SIDECAR"
          for result in "$CORE" "$SIDECAR"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
          # A skip is only acceptable when the classifier itself succeeded.
          if [ "$CHANGES" != "success" ] && { [ "$CORE" = "skipped" ] || [ "$SIDECAR" = "skipped" ]; }; then
            exit 1
          fi

  desktop-build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.desktop == 'true') }}
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure canonical temporary directory
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Verify desktop and diagnostics
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:probes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:probes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Keeps the ~100 MB third-party archive between runs. The key changes with
      # the script, so a new pin starts a new cache, and the script hashes a
      # cached archive against the pin before use, downloading again on a
      # mismatch. Releases skip the cache and always download fresh.
      - name: Restore the pinned ffmpeg archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\ffmpeg-archive
          key: ffmpeg-win64-${{ hashFiles('scripts/Get-PinnedFfmpeg.ps1') }}

      # The same pinned, checksum-verified binary release.yml packages, so the
      # packaged smoke below exercises the release layout.
      - name: Download ffmpeg (pinned + checksum-verified)
        shell: pwsh
        run: ./scripts/Get-PinnedFfmpeg.ps1 -ArchiveCache (Join-Path $env:RUNNER_TEMP 'ffmpeg-archive')

      - name: Build Windows app directory
        working-directory: desktop
        run: |
          npm run runtime:install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run package:dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Catch broken packaged startup (preload, asar layout, fuses, sidecar
      # handshake, codec playback) before merge instead of after a release tag.
      - name: Verify packaged startup and synthetic playback
        shell: pwsh
        run: ./scripts/Test-PackagedHost.ps1

  proxy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: proxy
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proxy/package-lock.json

      - name: Install pinned proxy dependencies
        run: npm ci

      # vitest strips types without checking them; this is the only typecheck.
      - name: Typecheck
        run: npm run typecheck

      - name: Proxy tests
        run: npm test

  site-and-scripts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Site tests
        run: node --test site/tests

      # Deploy guard, site staging allowlist and recording-benchmark analysis.
      - name: Script tests
        run: node --test scripts/*.test.mjs scripts/recording-benchmark/*.test.mjs

      - name: Video event recovery checks
        run: python3 -m unittest scripts/test_video_event_recovery.py
