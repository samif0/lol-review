name: Build & Release (Overwolf Electron)

# Overwolf Electron builds the app directory; Velopack retains the installed
# LoLReview identity, signing pipeline, release feed and delta chain.
# Validate the installer and update path with a prerelease before public rollout.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # OIDC token for Azure Artifact Signing (azure/login)

jobs:
  test:
    runs-on: windows-latest
    # Match CI's canonical fixture root; do not relax app path safeguards for
    # the hosted runner's default 8.3 TEMP alias.
    env:
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Run critical tests (Core)
        run: dotnet test src/Revu.Core.Tests/Revu.Core.Tests.csproj -c Release -p:Platform=x64 --logger "console;verbosity=normal"

      - name: Run sidecar write-contract tests
        run: dotnet test src/Revu.Sidecar.Tests/Revu.Sidecar.Tests.csproj -c Release -p:Platform=x64 --logger "console;verbosity=normal"

  build:
    runs-on: windows-latest
    needs: test
    env:
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned desktop dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts

      - name: Extract and stamp release version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:RELEASE_REF_TYPE -ne "tag" -or $env:RELEASE_REF -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Run this release workflow on a v<version> tag."
          }
          $version = $Matches[1]
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$env:RELEASE_REF" >> $env:GITHUB_ENV
          # npm stamps package.json and the root lock metadata together, without a commit.
          npm --prefix desktop version $version --no-git-tag-version --allow-same-version --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify desktop and diagnostics
        working-directory: desktop
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:probes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:probes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ffmpeg ships INSIDE the signed release (clip extraction), so it is
      # supply-chain pinned: a fixed (dated) BtbN build + SHA-256 verification.
      # Download failure is soft (clips are optional); a CHECKSUM MISMATCH is a
      # tamper signal and hard-fails. To bump: pick a newer autobuild tag and take
      # the asset's sha256 from the GitHub release API.
      - name: Download ffmpeg (pinned + checksum-verified)
        shell: pwsh
        run: |
          # 2026-08-31: the previous pin (autobuild-2026-06-09-15-17) was pruned
          # upstream and 404'd — the soft-fail meant v3.3.3 shipped WITHOUT
          # ffmpeg.exe. Hash verified against BtbN's checksums.sha256 AND an
          # independent local sha256 of the downloaded asset.
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-30-13-12/ffmpeg-n8.1.2-50-g1a748fe2cd-win64-gpl-8.1.zip"
          $expectedSha256 = "962D052FF9A18AE3558A521F91969E1F7D2CA3AA3D1116681E42F7D99F5B66FB"
          $downloaded = $false
          try {
            Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -TimeoutSec 300
            $downloaded = $true
          } catch {
            Write-Warning "ffmpeg download failed: $_ - building without it"
          }
          try {
            if ($downloaded) {
              $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
              if ($actual -ne $expectedSha256) {
                Write-Error "ffmpeg checksum mismatch - expected $expectedSha256, got $actual."
                exit 1
              }
              Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
              $exe = Get-ChildItem -Recurse -Filter "ffmpeg.exe" ffmpeg_tmp `
                     | Where-Object { $_.DirectoryName -like "*bin*" } | Select-Object -First 1
              if ($exe) {
                New-Item -ItemType Directory -Force -Path deps | Out-Null
                Copy-Item $exe.FullName -Destination deps\ffmpeg.exe
                Write-Host "ffmpeg ready"
              } else { Write-Warning "ffmpeg.exe not found in archive" }
            }
          } finally {
            $workflowRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
            foreach ($relative in @('ffmpeg.zip', 'ffmpeg_tmp')) {
              $target = [IO.Path]::GetFullPath((Join-Path $workflowRoot $relative))
              if ([IO.Path]::GetDirectoryName($target) -ne $workflowRoot) { throw "Unexpected cleanup path" }
              if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
            }
          }

      # Same isolated, allowlisted layout used by local packaging and CI. The
      # sidecar and self-contained dependencies sit next to revu-desktop.exe.
      - name: Package Overwolf Electron app directory
        working-directory: desktop
        run: |
          npm run runtime:install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run package:dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaged startup and synthetic playback
        shell: pwsh
        run: |
          $fixtureTool = Join-Path $env:GITHUB_WORKSPACE 'deps\ffmpeg.exe'
          if (Test-Path -LiteralPath $fixtureTool -PathType Leaf) {
            $env:PATH = (Split-Path -Parent $fixtureTool) + [IO.Path]::PathSeparator + $env:PATH
            $packagedSmokeExe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\desktop-package\win-unpacked\revu-desktop.exe'
            & ./scripts/Test-ElectronHost.ps1 -PackagedExe $packagedSmokeExe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Warning 'Packaged playback smoke skipped: the optional pinned FFmpeg download was unavailable.'
          }

      # ── Code signing (Azure Artifact Signing) — unchanged identity. OIDC login
      #    also authenticates Velopack's bundled SignTool via AzureCliCredential. ──
      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Sign the packaged app + sidecar exes BEFORE vpk packs. (exe only — the
      # bundled .NET runtime DLLs aren't what SmartScreen judges, and signing them
      # one-at-a-time blows the timeout, same rationale as the old WinUI flow.)
      - name: Sign published binaries
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: revu-signing
          certificate-profile-name: revu-public
          files-folder: ${{ github.workspace }}\artifacts\desktop-package\win-unpacked
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          timeout: 900

      - name: Install vpk CLI
        # Match the sidecar client and retain its installed launcher layout.
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Configure Velopack signing
        shell: pwsh
        run: |
          $metadataPath = Join-Path $env:RUNNER_TEMP 'revu-signing-metadata.json'
          @{
            Endpoint = 'https://eus.codesigning.azure.net/'
            CodeSigningAccountName = 'revu-signing'
            CertificateProfileName = 'revu-public'
          } | ConvertTo-Json | Set-Content -LiteralPath $metadataPath -Encoding utf8NoBOM
          "SIGNING_METADATA=$metadataPath" >> $env:GITHUB_ENV

      - name: Download previous Velopack release (for delta generation)
        shell: pwsh
        run: |
          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}"

      # Keep install identity and launcher continuity. Sign during packing so the
      # updater and launcher INSIDE each package are signed as well as Setup.exe.
      # Already-signed app exes are skipped; DLLs retain their original signatures.
      - name: Pack Velopack release
        shell: pwsh
        run: |
          vpk pack `
            --packId LoLReview `
            --packTitle "Revu" `
            --packVersion "${{ env.VERSION }}" `
            --packDir artifacts/desktop-package/win-unpacked `
            --mainExe revu-desktop.exe `
            --aumid gg.revu.desktop `
            --icon desktop/electron/branding/revu.ico `
            --azureTrustedSignFile "$env:SIGNING_METADATA" `
            --signExclude '(?i)^(?!.*\.exe$).*' `
            --outputDir Releases

      - name: Verify installer and packaged executable signatures
        shell: pwsh
        run: |
          function Assert-Signed([string] $file) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') {
              throw "Invalid release signature ($($signature.Status)): $file"
            }
          }
          Assert-Signed (Join-Path $env:GITHUB_WORKSPACE 'Releases/LoLReview-win-Setup.exe')
          $package = Join-Path $env:GITHUB_WORKSPACE "Releases/LoLReview-$env:VERSION-full.nupkg"
          $verifyRoot = Join-Path $env:RUNNER_TEMP ('revu-signatures-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $verifyRoot | Out-Null
          $archive = [IO.Compression.ZipFile]::OpenRead($package)
          try {
            foreach ($name in @('revu-desktop.exe', 'Revu.Sidecar.exe', 'Squirrel.exe', 'revu-desktop_ExecutionStub.exe')) {
              $entries = @($archive.Entries | Where-Object Name -eq $name)
              if ($entries.Count -ne 1) { throw "Expected one packaged executable: $name" }
              $destination = Join-Path $verifyRoot $name
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entries[0], $destination)
              Assert-Signed $destination
            }
          } finally {
            $archive.Dispose()
            $resolved = [IO.Path]::GetFullPath($verifyRoot)
            if ([IO.Path]::GetDirectoryName($resolved) -ne [IO.Path]::GetFullPath($env:RUNNER_TEMP)) {
              throw 'Unexpected signature verification cleanup path'
            }
            Remove-Item -LiteralPath $resolved -Recurse -Force
          }

      - name: Upload Velopack release to GitHub
        shell: pwsh
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --publish `
            --releaseName "Revu v${{ env.VERSION }}" `
            --tag "${{ env.TAG }}"

      # Velopack names the installer after --packId (LoLReview-win-Setup.exe). We keep
      # packId=LoLReview for update continuity but ship a cleanly-named COPY
      # (Revu-Setup.exe) as an extra asset; the website download button prefers it.
      - name: Stage cleanly-named installer copy
        shell: pwsh
        run: |
          $setup = Get-ChildItem Releases -Filter "*-win-Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "No *-win-Setup.exe found in Releases" }
          Copy-Item $setup.FullName -Destination "Releases/Revu-Setup.exe"
          Write-Host "Staged Revu-Setup.exe from $($setup.Name)"

      - name: Attach cleanly-named installer to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG }}
          files: Releases/Revu-Setup.exe
          fail_on_unmatched_files: true
