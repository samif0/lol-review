name: Build & Release (Overwolf Electron)

# Overwolf Electron builds the app directory; Velopack retains the installed
# LoLReview identity, signing pipeline, release feed and delta chain.
#
# ONLY REVIEWED MAIN SHIPS: the guard job refuses a tag whose commit is not on
# origin/main (v3.0.11/12 once shipped from an unmerged branch). A hyphenated
# version such as v3.15.0-beta.1 publishes as a GitHub prerelease that stable
# installs never auto-update to (see the publish job). Validate the installer and
# update path with such a prerelease before a public rollout.
#
# PINNING POLICY: this pipeline produces the signed binaries every install
# auto-updates to, so nothing that runs in it may float. Every `uses:` is pinned
# to a full commit SHA (the trailing comment is the human-readable tag; Dependabot
# proposes bumps), runner images are named (windows-2025, ubuntu-24.04, never
# *-latest), the .NET SDK comes from global.json, NuGet restores in locked
# mode (Directory.Build.props), vpk is the Velopack version in
# src/Revu.Sidecar/Revu.Sidecar.csproj, desktop dependencies come from the
# lockfile via `npm ci`, and ffmpeg is checksum-verified
# (scripts/Get-PinnedFfmpeg.ps1). Bump these deliberately, in their own commit.
#
# PERMISSIONS: nothing is granted at workflow level. Third-party package code
# (NuGet test dependencies, npm build tooling) runs only in read-only jobs. Only
# the sign job can request the OIDC token the Azure Trusted Signing federation
# trusts for v* tags, and only the publish job can write releases.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# One release at a time and never cancelled midway: delta generation reads the
# previous published release. GitHub keeps at most one run pending per group, so
# push release tags one at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dotnet_sdk: ${{ steps.sdk.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$RELEASE_REF_TYPE" != "tag" ] || ! printf '%s' "$RELEASE_REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Run this release workflow on a v<version> tag."
            exit 1
          fi
          version="${RELEASE_REF#v}"
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "tag=$RELEASE_REF"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Release $RELEASE_REF (version $version, prerelease: $prerelease)"

      # An in-workflow check runs the tagged commit's own copy of this file, so it
      # stops mistakes, not a hostile writer; a v* tag ruleset is the durable
      # control (see CONTRIBUTING.md).
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse --verify 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::Tagged commit $commit is not on origin/main. Merge it to main, then tag the merged commit."
            exit 1
          fi
          echo "Tagged commit $commit is on origin/main."

      # The publish job has no checkout, so it reads the SDK pin from here.
      - name: Read the pinned .NET SDK
        id: sdk
        run: |
          sdk="$(jq -r '.sdk.version' global.json)"
          if ! printf '%s' "$sdk" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::global.json must pin an exact .NET SDK version."
            exit 1
          fi
          echo "version=$sdk" >> "$GITHUB_OUTPUT"

  test:
    needs: guard
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Match CI's canonical fixture root without relaxing app path safeguards.
      - name: Configure canonical temporary directory
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Run critical tests (Core)
        run: dotnet test src/Revu.Core.Tests/Revu.Core.Tests.csproj -c Release -p:Platform=x64 --logger "console;verbosity=normal"

      - name: Run sidecar write-contract tests
        run: dotnet test src/Revu.Sidecar.Tests/Revu.Sidecar.Tests.csproj -c Release -p:Platform=x64 --logger "console;verbosity=normal"

  package:
    needs: [guard, test]
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure canonical temporary directory
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install pinned desktop dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts

      # npm stamps package.json and the root lock metadata together, without a
      # commit. package.mjs stamps the host and sidecar version resources from it.
      - name: Stamp release version
        shell: pwsh
        run: |
          npm --prefix desktop version $env:VERSION --no-git-tag-version --allow-same-version --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify desktop and diagnostics
        working-directory: desktop
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:probes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:probes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Clip extraction and packaged playback verification require this binary;
      # never publish a release that silently omits it.
      - name: Download ffmpeg (pinned + checksum-verified)
        shell: pwsh
        run: ./scripts/Get-PinnedFfmpeg.ps1

      # Same isolated, allowlisted layout used by local packaging and CI. The
      # sidecar and self-contained dependencies sit next to revu-desktop.exe.
      - name: Package Overwolf Electron app directory
        working-directory: desktop
        run: |
          npm run runtime:install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run package:dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaged startup and synthetic playback
        shell: pwsh
        run: ./scripts/Test-PackagedHost.ps1

      - name: Hand the unsigned app directory to the sign job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-package
          path: artifacts/desktop-package/win-unpacked
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [guard, package]
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write   # OIDC token for Azure Artifact Signing (azure/login)
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      # Source is needed only for the installer icon; nothing from it is executed.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download the packaged app directory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-package
          path: artifacts/desktop-package/win-unpacked

      # Same SDK the package job used; keeps any SDK command in this checkout on
      # the global.json pin.
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # ── Code signing (Azure Artifact Signing) — unchanged identity. OIDC login
      #    also authenticates Velopack's bundled SignTool via AzureCliCredential. ──
      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Sign the packaged app + sidecar exes BEFORE vpk packs. (exe only — the
      # bundled .NET runtime DLLs aren't what SmartScreen judges, and signing them
      # one-at-a-time blows the timeout, same rationale as the old WinUI flow.)
      - name: Sign published binaries
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: revu-signing
          certificate-profile-name: revu-public
          files-folder: ${{ github.workspace }}\artifacts\desktop-package\win-unpacked
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          timeout: 900

      # Match the sidecar client and retain its installed launcher layout.
      # Installed outside the repository so global.json's SDK pin does not apply.
      - name: Install vpk CLI
        working-directory: ${{ runner.temp }}
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Configure Velopack signing
        shell: pwsh
        run: |
          $metadataPath = Join-Path $env:RUNNER_TEMP 'revu-signing-metadata.json'
          @{
            Endpoint = 'https://eus.codesigning.azure.net/'
            CodeSigningAccountName = 'revu-signing'
            CertificateProfileName = 'revu-public'
          } | ConvertTo-Json | Set-Content -LiteralPath $metadataPath -Encoding utf8NoBOM
          "SIGNING_METADATA=$metadataPath" >> $env:GITHUB_ENV

      # Without --pre this is the latest STABLE release, so prereleases never
      # become a delta base for the stable chain.
      - name: Download previous Velopack release (for delta generation)
        shell: pwsh
        run: |
          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}"

      # Keep install identity and launcher continuity. Sign during packing so the
      # updater and launcher INSIDE each package are signed as well as Setup.exe.
      # Already-signed app exes are skipped; DLLs retain their original signatures.
      - name: Pack Velopack release
        shell: pwsh
        run: |
          vpk pack `
            --packId LoLReview `
            --packTitle "Revu" `
            --packVersion "$env:VERSION" `
            --packDir artifacts/desktop-package/win-unpacked `
            --mainExe revu-desktop.exe `
            --aumid gg.revu.desktop `
            --icon desktop/electron/branding/revu.ico `
            --azureTrustedSignFile "$env:SIGNING_METADATA" `
            --signExclude '(?i)^(?!.*\.exe$).*' `
            --outputDir Releases

      - name: Verify installer and packaged executable signatures
        shell: pwsh
        run: |
          function Assert-Signed([string] $file) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') {
              throw "Invalid release signature ($($signature.Status)): $file"
            }
          }
          Assert-Signed (Join-Path $env:GITHUB_WORKSPACE 'Releases/LoLReview-win-Setup.exe')
          $package = Join-Path $env:GITHUB_WORKSPACE "Releases/LoLReview-$env:VERSION-full.nupkg"
          $verifyRoot = Join-Path $env:RUNNER_TEMP ('revu-signatures-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $verifyRoot | Out-Null
          $archive = [IO.Compression.ZipFile]::OpenRead($package)
          try {
            foreach ($name in @('revu-desktop.exe', 'Revu.Sidecar.exe', 'ffmpeg.exe', 'Squirrel.exe', 'revu-desktop_ExecutionStub.exe')) {
              $entries = @($archive.Entries | Where-Object Name -eq $name)
              if ($entries.Count -ne 1) { throw "Expected one packaged executable: $name" }
              $destination = Join-Path $verifyRoot $name
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entries[0], $destination)
              Assert-Signed $destination
            }
          } finally {
            $archive.Dispose()
            $resolved = [IO.Path]::GetFullPath($verifyRoot)
            if ([IO.Path]::GetDirectoryName($resolved) -ne [IO.Path]::GetFullPath($env:RUNNER_TEMP)) {
              throw 'Unexpected signature verification cleanup path'
            }
            Remove-Item -LiteralPath $resolved -Recurse -Force
          }

      - name: Hand the signed Velopack release to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: velopack-release
          path: Releases
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [guard, sign]
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ needs.guard.outputs.tag }}
      PRERELEASE: ${{ needs.guard.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the signed Velopack release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: velopack-release
          path: Releases

      # Same SDK as every other job (global.json, read by the guard job), so vpk
      # never depends on whichever .NET the runner image happens to carry.
      - name: Setup .NET (global.json pin)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ needs.guard.outputs.dotnet_sdk }}

      - name: Install vpk CLI
        working-directory: ${{ runner.temp }}
        run: dotnet tool install -g vpk --version 1.2.0

      # A re-run after a partial failure finds the draft the earlier attempt left,
      # and vpk refuses to upload over any release with the same tag or name. Delete
      # such drafts (by id, so a published release is never touched); refuse if the
      # tag or name is already published.
      - name: Remove a draft left by an earlier attempt
        shell: pwsh
        run: |
          $releaseName = "Revu v$env:VERSION"
          $lines = @(gh api --paginate "repos/$env:GH_REPO/releases?per_page=100" --jq '.[] | {id, draft, tag_name, name} | @json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $existing = @($lines | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.tag_name -ceq $env:TAG -or $_.name -ceq $releaseName })
          foreach ($release in $existing) {
            if (-not $release.draft) {
              throw "Release $($release.tag_name) ('$($release.name)') is already published; refusing to replace it. Release a new version instead."
            }
          }
          foreach ($release in $existing) {
            Write-Host "Deleting draft release $($release.id) ($($release.tag_name), '$($release.name)') left by an earlier attempt."
            gh api --method DELETE "repos/$env:GH_REPO/releases/$($release.id)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Upload as a DRAFT: nothing is visible to users or the updater until every
      # asset is attached and checked below.
      #
      # Prereleases: `--pre` (not a separate `--channel`). Installed clients read
      # releases/latest/download (UpdateService.ReleaseFeedUrl), and GitHub's
      # "latest" never resolves to a prerelease, so stable users are never offered
      # a beta. Keeping the default "win" channel means a tester who installed a
      # beta still moves to the next stable release; a separate channel would
      # strand them, because the client sets no explicit channel and the stable
      # feed carries no releases.<channel>.json for it.
      - name: Upload Velopack release to GitHub as a draft
        shell: pwsh
        run: |
          $arguments = @('upload', 'github',
            '--repoUrl', "https://github.com/$env:GH_REPO",
            '--token', $env:GH_TOKEN,
            '--releaseName', "Revu v$env:VERSION",
            '--tag', $env:TAG)
          if ($env:PRERELEASE -eq 'true') { $arguments += '--pre' }
          & vpk @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Velopack names the installer after --packId (LoLReview-win-Setup.exe). We keep
      # packId=LoLReview for update continuity but ship a cleanly-named COPY
      # (Revu-Setup.exe) as an extra asset; the website download button prefers it.
      - name: Attach cleanly-named installer to the draft
        shell: pwsh
        run: |
          $setup = Get-ChildItem Releases -Filter "*-win-Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "No *-win-Setup.exe found in Releases" }
          Copy-Item $setup.FullName -Destination "Releases/Revu-Setup.exe"
          gh release upload $env:TAG "Releases/Revu-Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the draft before it goes live
        shell: pwsh
        run: |
          $release = gh release view $env:TAG --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $release.isDraft) { throw "Release $env:TAG is already public; refusing to continue." }
          if ($release.isPrerelease -ne ($env:PRERELEASE -eq 'true')) {
            throw "Release $env:TAG prerelease flag is $($release.isPrerelease), expected $env:PRERELEASE."
          }
          $names = @($release.assets | ForEach-Object name)
          foreach ($required in @('releases.win.json', "LoLReview-$env:VERSION-full.nupkg", 'LoLReview-win-Setup.exe', 'Revu-Setup.exe')) {
            if ($names -notcontains $required) { throw "Release $env:TAG is missing asset $required." }
          }
          Write-Host "Draft $env:TAG carries $($names.Count) assets: $($names -join ', ')"

      - name: Publish the release
        shell: pwsh
        run: |
          $arguments = @('release', 'edit', $env:TAG, '--draft=false')
          if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
