# Cloudflare Worker config. The `name` below becomes part of the deployed URL:
# https://<name>.<account-subdomain>.workers.dev
#
# Rename freely. After changing it, run `npm run deploy` and update the desktop
# app's RIOT_PROXY_URL config field to the new URL.
name = "revu-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-10"

# Secrets (set via `wrangler secret put <NAME>`; never commit):
#   RIOT_API_KEY    — your permanent Riot API key
#   ALLOWED_TOKENS  — DELETED 2026-06-19. Legacy static operator-token allowlist from
#                     before email-OTP sessions existed. All proxy auth now goes through
#                     user sessions (D1 sessions table). authOrDeny still has a static
#                     fallback for an empty/unset value (harmless dead path). Do NOT
#                     re-add a user's session token here — it collides with the session
#                     lookup and 403s clip uploads (see authOrDeny precedence note).
#   VOD_PLAY_SECRET: signs the play tokens of HLS full-game shares (at least
#                     32 chars, e.g. `node -e "console.log(require('crypto')
#                     .randomBytes(32).toString('base64url'))"`). Unset: no new
#                     HLS shares and HLS playback answers 503. Rotating it ends
#                     every token in flight; pages mint a new one (one counted play).
#
# Non-secret vars can go here:
[vars]
# Aggregate hard cap across ALL users + ALL isolates, as a safety margin under
# Riot's app-rate-limit. This is now a TRUE global cap: it is enforced by the
# GlobalRateLimiter Durable Object (one singleton counter for the whole Worker),
# not the old per-isolate bucket, so the real rate hitting Riot no longer scales
# with the number of Worker isolates.
#
# CONFIRM THE KEY TIER before setting this — AGGREGATE_RPS MUST stay under the
# REAL app-rate-limit of the key in RIOT_API_KEY, or the shared key gets
# throttled/banned (a GLOBAL outage):
#   - Development key  → ~20 req/s (and 100 req / 2 min). Default 18 fits here.
#   - Personal key     → typically 20 req/s / 100 per 2 min (same ballpark).
#   - Production key    → much higher (e.g. 500/10s, 30000/10min); negotiated.
# Confirm the live limit on the Riot Developer Portal app page (the key's
# "Rate Limits" panel) or read the X-App-Rate-Limit response header Riot returns
# on any call. If you upgrade tiers, bump this value AND re-confirm — do not
# guess. Leave headroom (we run 18 under a 20/s dev cap).
AGGREGATE_RPS = "18"
# Per-token cap in requests/second. Session-token (Path B) users share this;
# static-token (Path A) operators use the same limit.
PER_TOKEN_RPS = "2"

# Comma-separated list of browser Origins allowed to call the proxy (for the web
# review tool). Leave unset in prod if only the desktop app uses this Worker.
ALLOWED_ORIGINS = "https://revu.lol,https://www.revu.lol,http://localhost:8788,http://127.0.0.1:8788"

# Magic-link emails are sent from this address. Must be on a Resend-verified domain.
MAGIC_LINK_FROM = "login@revu.lol"
# Link the user clicks in the email. For v1, a minimal landing page served by the
# Worker itself at /auth/claim — shows the one-time code to paste in the desktop app.
APP_NAME = "Revu"

# Origin used to BUILD shareable clip links. Clips are served on a dedicated
# subdomain so they never interfere with the main Pages site. No trailing slash.
PUBLIC_BASE = "https://clips.revu.lol"
# Origin of the static site that serves clip.html (the watch page). The Worker
# redirects clips.revu.lol/<id> here. No trailing slash.
WATCH_BASE = "https://revu.lol"

# Web accounts (revu.lol sign-in, My clips, Account). The cookie-authenticated
# /auth/web/* API answers ONLY on this origin's host; on any other host
# (including workers.dev, which is on the Public Suffix List) it is 404 and no
# cookie is ever set. No trailing slash.
AUTH_BASE = "https://clips.revu.lol"
# Exact Origins allowed to call /auth/web/* with credentials. Kept separate from
# ALLOWED_ORIGINS above, which includes localhost.
CREDENTIALED_ORIGINS = "https://revu.lol,https://www.revu.lol"
# Hostnames a web sign-in Turnstile token must be issued for. Leaving this
# empty disables web sign-in (providers is [] and start returns 503).
TURNSTILE_HOSTNAMES = "revu.lol,www.revu.lol"
# Local dev overrides these in the gitignored proxy/.dev.vars (never commit it,
# and never put TURNSTILE_DEV_RELAX in this file):
#   AUTH_BASE=http://localhost:8787
#   CREDENTIALED_ORIGINS=http://localhost:8788
#   TURNSTILE_DEV_RELAX=1
#   TURNSTILE_SECRET_KEY=<Cloudflare's documented always-pass test secret>
#   RESEND_API_KEY=<your own Resend key>
# TURNSTILE_DEV_RELAX only takes effect while AUTH_BASE starts with
# http://localhost:, so it can never relax production.

# Storage budget in bytes. It covers EVERY stored object in the CLIPS bucket:
# clips and full-game (VOD) shares, in every state (uploading reservations,
# ready, purging rows) plus storage_tombstones. Clip uploads past the total are
# refused (403 storage_full); VOD starts past either budget are 409 pool_full.
# VOD_BUDGET_BYTES is clamped to the total. Raise both if storage becomes paid.
TOTAL_BUDGET_BYTES = "9000000000"
VOD_BUDGET_BYTES = "7000000000"
# One account's share of the pool: clip bytes (ready plus pending reservations)
# an account outside vod_sharers may hold, so no single account can fill it.
# Over it, clip uploads get the usual 403 quota_exceeded. Raise with the total.
USER_CLIP_BUDGET_BYTES = "3000000000"
# Kill switches for full-game sharing. "0" or "off" turns off new VOD share
# starts (VOD_SHARING) or VOD playback (VOD_SERVING); anything else is on.
# The D1 table ops_flags can also turn VOD playback off without a deploy
# (README "Kill switches").
VOD_SHARING = "1"
VOD_SERVING = "1"
# New HLS shares (watch a game while it uploads): "0" off, "1" on, or
# "users:<id>,<id>" for those accounts only (the canary). It gates new starts
# only; shares already uploading keep uploading and serving. It needs Workers
# Paid, the WAF rate rule on clips.revu.lol, the VOD_PLAY_SECRET secret and the
# site's HLS player (README "HLS shares"). The ops_flags row vod_hls = '0' holds
# it off without a deploy; deleting the row turns it on within 30 s.
VOD_HLS = "1"

[[d1_databases]]
binding = "DB"
database_name = "revu-db"
database_id = "cfdaaa55-8443-480f-96e5-04eb3eb8c6ff"

# Object storage for shared clip video files. Requires R2 to be enabled on the
# Cloudflare account (Dashboard → R2 → enable), then:
#   wrangler r2 bucket create revu-clips
# Local `wrangler dev` simulates this bucket on disk without R2 being enabled.
[[r2_buckets]]
binding = "CLIPS"
bucket_name = "revu-clips"
# Long clips (over 95 MiB) upload through R2 multipart (POST /clips/uploads,
# PUT /clips/:id/parts/:n, POST /clips/:id/complete). The Worker auto-aborts idle
# uploads and the hourly cron aborts expired ones. OPTIONAL extra safety net: an
# R2 lifecycle rule on revu-clips that aborts incomplete multipart uploads after
# 1 day. The integrator may add it with `wrangler r2 bucket lifecycle add`; it is
# not required.

# Workers AI. Powers POST /transcribe (Whisper large-v3-turbo) for narrated clip
# transcripts. Daily audio caps live in D1 (transcribe_usage).
[ai]
binding = "AI"

# Global rate limiter. A single Durable Object instance (addressed by the fixed
# name "global") holds the TRUE aggregate request counter across every Worker
# isolate, fixing the per-isolate N×AGGREGATE_RPS overshoot. The Worker fails
# OPEN if this DO is unreachable, so a limiter outage degrades to per-isolate
# limiting rather than blocking all traffic.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "GlobalRateLimiter"

# Durable Object migration. Required the first time a DO class is introduced:
# `wrangler deploy` reads this to register GlobalRateLimiter. Bump the tag and
# add a new [[migrations]] block for future DO class renames/deletes.
# NOTE: new_sqlite_classes (not new_classes) — the free plan only allows
# SQLite-backed Durable Objects. GlobalRateLimiter keeps its 1s window in
# in-memory instance fields (no storage API used), so the backing class is
# immaterial to behavior; this just satisfies the free-tier requirement.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GlobalRateLimiter"]

# Hourly cleanup: settles quiet HLS shares (ends a watchable one at its edge,
# discards the rest), then expired clips and VOD shares (3-day retention) and
# expired pending uploads. Purges R2 objects + D1 rows, retries storage
# tombstones, then expired sessions, then usage rows (transcribe, email, VOD
# starts, part uploads) older than 7 days, and last discards at most 5 pending
# uploads of any account idle for 30 minutes.
[triggers]
crons = ["0 * * * *"]

# Workers Logs: what the code logs with console.log/console.error (structured
# JSON with hashed or no identifiers), sampled at 10%. Invocation logs are OFF
# on purpose: they record each request's URL, and an HLS media URL carries a
# play token (/vod-hls/<id>/<token>/...). No token, cookie or raw IP address is
# ever logged; paths in error logs have the token replaced (http.ts loggablePath).
[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
invocation_logs = false
